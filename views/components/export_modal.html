<div id="export-modal">
    <div class="modal-box">
        <h3 style="color:#38bdf8; margin-bottom:4px; font-size:16px;">🎬 4K Master Video Export</h3>
        <div style="color:#94a3b8; font-size:11px; margin-bottom:12px;">3840×2160 • 60 FPS • 12-bit HDR</div>
        
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="export-fill"></div>
        </div>
        
        <div style="display:flex; justify-content:space-between; font-size:11px; font-family:monospace; margin-bottom:14px;">
            <span id="export-status-text" style="color:#38bdf8;">Encoding Frame 0 / 10800</span>
            <span id="export-pct-text" style="color:#22c55e; font-weight:bold;">0%</span>
        </div>

        <button class="m-btn" id="export-close-btn" style="background:#334155; padding:6px 18px; font-size:11px; border-radius:6px;" onclick="closeExportModal()">Cancel</button>
    </div>
</div>

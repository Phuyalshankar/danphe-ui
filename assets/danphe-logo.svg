<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes danphe-crest-sway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-8deg) translateY(-2px); }
        }
        @keyframes danphe-wing-pulse {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.025, 0.975) translateY(-1px); }
        }
        @keyframes danphe-glow-breathe {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.4)); }
            50% { filter: drop-shadow(0 0 22px rgba(245, 158, 11, 0.6)) drop-shadow(0 0 35px rgba(59, 130, 246, 0.4)); }
        }
        .danphe-glow { animation: danphe-glow-breathe 4s ease-in-out infinite; }
        .danphe-crest { animation: danphe-crest-sway 2.5s ease-in-out infinite; transform-origin: 108px 45px; }
        .danphe-wing { animation: danphe-wing-pulse 3s ease-in-out infinite; transform-origin: 100px 100px; }
    </style>

    <defs>
        <linearGradient id="crest-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="50%" stop-color="#059669"/>
            <stop offset="100%" stop-color="#064e3b"/>
        </linearGradient>
        <linearGradient id="head-grad" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="40%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <linearGradient id="neck-copper" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="40%" stop-color="#f97316"/>
            <stop offset="80%" stop-color="#dc2626"/>
            <stop offset="100%" stop-color="#7f1d1d"/>
        </linearGradient>
        <linearGradient id="mantle-cobalt" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#1e1b4b"/>
        </linearGradient>
        <linearGradient id="wing-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2dd4bf"/>
            <stop offset="40%" stop-color="#059669"/>
            <stop offset="80%" stop-color="#0f766e"/>
            <stop offset="100%" stop-color="#022c22"/>
        </linearGradient>
        <linearGradient id="wing-primary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="40%" stop-color="#4f46e5"/>
            <stop offset="80%" stop-color="#312e81"/>
            <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        <linearGradient id="tail-rufous" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="50%" stop-color="#b45309"/>
            <stop offset="100%" stop-color="#78350f"/>
        </linearGradient>
        <linearGradient id="beak-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="60%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#334155"/>
        </linearGradient>
        <radialGradient id="eye-orbit" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="80%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0369a1"/>
        </radialGradient>
        <filter id="specular-3d" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
        </filter>
    </defs>

    <g class="danphe-glow">
        <!-- Tail Fan -->
        <g class="danphe-tail" filter="url(#specular-3d)">
            <path d="M 50 145 C 30 165 20 180 15 190 C 35 185 60 170 80 155 Z" fill="url(#tail-rufous)" opacity="0.95"/>
            <path d="M 58 142 C 40 162 30 178 25 188 C 45 182 70 168 88 152 Z" fill="url(#tail-rufous)"/>
            <path d="M 68 140 C 50 160 42 175 38 185 C 55 178 80 165 96 148 Z" fill="#92400e"/>
        </g>

        <!-- Obsidian Belly -->
        <path d="M 75 125 C 65 145 75 165 95 170 C 120 175 140 155 145 135 C 135 140 100 145 75 125 Z" fill="#090d16" filter="url(#specular-3d)"/>

        <!-- Mantle Back -->
        <path d="M 85 90 C 70 105 65 130 80 145 C 105 150 135 135 140 115 C 130 95 105 85 85 90 Z" fill="url(#mantle-cobalt)" filter="url(#specular-3d)"/>

        <!-- 3D Wing -->
        <g class="danphe-wing" filter="url(#specular-3d)">
            <path d="M 95 95 C 125 100 155 120 160 145 C 145 155 125 155 105 150 C 90 135 88 115 95 95 Z" fill="url(#wing-primary)"/>
            <path d="M 98 96 C 120 102 145 115 148 135 C 135 142 118 142 105 138 C 96 125 94 110 98 96 Z" fill="url(#wing-emerald)"/>
            <path d="M 108 105 C 125 112 140 125 142 138" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
            <path d="M 116 112 C 130 118 145 130 146 142" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
            <path d="M 102 118 C 115 125 130 138 132 148" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
        </g>

        <!-- Copper Neck -->
        <path d="M 105 55 C 88 68 85 85 92 102 C 105 105 120 95 122 80 C 125 65 118 55 105 55 Z" fill="url(#neck-copper)" filter="url(#specular-3d)"/>
        <path d="M 96 62 C 90 72 88 84 94 96 C 96 86 98 74 104 66 Z" fill="#fde047" opacity="0.85"/>

        <!-- Head & Eye -->
        <g class="danphe-head" filter="url(#specular-3d)">
            <path d="M 115 42 C 105 42 98 50 102 62 C 108 72 122 75 132 68 C 138 62 135 48 125 44 Z" fill="url(#head-grad)"/>
            <path d="M 116 48 C 112 50 112 58 118 60 C 124 61 128 55 125 50 C 122 47 118 47 116 48 Z" fill="url(#eye-orbit)"/>
            <circle cx="119" cy="54" r="3" fill="#f59e0b"/>
            <circle cx="119" cy="54" r="1.8" fill="#020617"/>
            <circle cx="118.2" cy="53" r="0.8" fill="#ffffff"/>
            <path d="M 132 52 C 145 54 154 58 158 64 C 148 66 138 64 130 62 Z" fill="url(#beak-grad)"/>
            <path d="M 130 62 C 138 63 145 64 150 67 C 142 68 134 66 128 64 Z" fill="#475569"/>
        </g>

        <!-- Crest Feathers -->
        <g class="danphe-crest" filter="url(#specular-3d)">
            <path d="M 110 44 Q 95 28 85 18" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <ellipse cx="84" cy="17" rx="4" ry="6" transform="rotate(-30 84 17)" fill="url(#crest-grad)"/>
            <circle cx="83.5" cy="16" r="1.5" fill="#a7f3d0"/>

            <path d="M 112 43 Q 102 24 95 12" stroke="#059669" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <ellipse cx="94" cy="11" rx="4" ry="6" transform="rotate(-15 94 11)" fill="url(#crest-grad)"/>
            <circle cx="93.5" cy="10" r="1.5" fill="#6ee7b7"/>

            <path d="M 115 44 Q 110 26 106 15" stroke="#047857" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <ellipse cx="105" cy="14" rx="3.5" ry="5.5" transform="rotate(5 105 14)" fill="url(#crest-grad)"/>
            <circle cx="104.5" cy="13" r="1.2" fill="#34d399"/>

            <path d="M 108 45 Q 92 34 80 26" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <ellipse cx="79" cy="25" rx="3" ry="4.5" transform="rotate(-40 79 25)" fill="url(#crest-grad)"/>
        </g>
    </g>
</svg>
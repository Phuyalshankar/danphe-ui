<svg viewBox="0 0 100 122.5" width="100" height="122.5" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes flag-wave {
            0%, 100% { transform: skewY(0deg) scaleY(1); }
            25% { transform: skewY(1.5deg) scaleY(1.015); }
            75% { transform: skewY(-1.5deg) scaleY(0.985); }
        }
        .nepal-flag-wave {
            animation: flag-wave 3s ease-in-out infinite;
            transform-origin: left center;
        }
    </style>
    <g class="nepal-flag-wave">
        <!-- Blue Border -->
        <polygon points="0,0 75,45 28,45 88,122.5 0,122.5" fill="#003893" />
        <!-- Crimson Field -->
        <polygon points="4,7 65,42 22,42 78,116 4,116" fill="#C8102E" />
        
        <!-- 8-Ray Crescent Moon -->
        <g transform="translate(23, 26)">
            <path d="M -10,0 A 10,10 0 0,0 10,0 A 12,8 0 0,1 -10,0 Z" fill="#FFFFFF" />
            <polygon points="-7,-1 -5,3 -3,0 -1,4 1,0 3,4 5,0 7,3" fill="#FFFFFF" />
        </g>

        <!-- 12-Ray Sun -->
        <g transform="translate(23, 80)">
            <circle cx="0" cy="0" r="5.5" fill="#FFFFFF" />
            <g fill="#FFFFFF">
                <polygon points="0,-10 1.5,-6 -1.5,-6" />
                <polygon points="5,-8.6 3.5,-4.5 1.5,-6" />
                <polygon points="8.6,-5 4.5,-3.5 6,-1.5" />
                <polygon points="10,0 6,1.5 6,-1.5" />
                <polygon points="8.6,5 4.5,3.5 6,1.5" />
                <polygon points="5,8.6 3.5,4.5 1.5,6" />
                <polygon points="0,10 1.5,6 -1.5,6" />
                <polygon points="-5,8.6 -3.5,4.5 -1.5,6" />
                <polygon points="-8.6,5 -4.5,3.5 -6,1.5" />
                <polygon points="-10,0 -6,-1.5 -6,1.5" />
                <polygon points="-8.6,-5 -4.5,-3.5 -6,-1.5" />
                <polygon points="-5,-8.6 -3.5,-4.5 -1.5,-6" />
            </g>
        </g>
    </g>
</svg>